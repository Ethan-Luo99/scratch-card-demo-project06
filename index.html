<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>刮刮卡 · Fabric v7</title>
  </head>
  <body>
    <main class="page">
      <h1 class="title">刮刮卡 Demo</h1>
      <p class="subtitle">在涂层上按住刮开，露出 70% 自动揭晓奖品</p>

      <div class="card-viewport">
        <div id="card-host" class="card-host">
          <canvas id="scratch-canvas" width="375" height="500"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="progress-row">
          <span class="progress-label">刮开进度</span>
          <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-text" class="progress-text">0%</span>
        </div>
        <button id="reset-btn" type="button" class="reset-btn">重置</button>
      </div>

      <p id="status" class="status">状态：待开始</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
