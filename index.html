<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>刮刮卡 · Fabric v7 多实例</title>
  </head>
  <body>
    <main class="page">
      <h1 class="title">刮刮卡 Demo</h1>
      <p class="subtitle">同页两张独立实例，露出 70% 自动揭晓奖品</p>

      <div class="cards-row">
        <section class="card-column" style="--card-w: 375px; --card-ar: 375 / 500">
          <div class="card-viewport">
            <div id="card-host-a" class="card-host">
              <canvas id="scratch-canvas-a" width="375" height="500"></canvas>
            </div>
          </div>
          <div class="panel">
            <div class="progress-row">
              <span class="progress-label">卡片 A</span>
              <div class="progress-track">
                <div id="progress-bar-a" class="progress-bar"></div>
              </div>
              <span id="progress-text-a" class="progress-text">0%</span>
            </div>
            <button id="reset-btn-a" type="button" class="reset-btn">重置 A</button>
            <p id="status-a" class="status">状态：待开始</p>
            <p id="peer-hint-a" class="peer-hint" hidden>对方已揭晓 🎉</p>
          </div>
        </section>

        <section class="card-column" style="--card-w: 300px; --card-ar: 1 / 1">
          <div class="card-viewport">
            <div id="card-host-b" class="card-host">
              <canvas id="scratch-canvas-b" width="300" height="300"></canvas>
            </div>
          </div>
          <div class="panel">
            <div class="progress-row">
              <span class="progress-label">卡片 B</span>
              <div class="progress-track">
                <div id="progress-bar-b" class="progress-bar"></div>
              </div>
              <span id="progress-text-b" class="progress-text">0%</span>
            </div>
            <button id="reset-btn-b" type="button" class="reset-btn">重置 B</button>
            <p id="status-b" class="status">状态：待开始</p>
            <p id="peer-hint-b" class="peer-hint" hidden>对方已揭晓 🎉</p>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
